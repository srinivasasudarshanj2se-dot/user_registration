spring:
  application:
    name: user_registration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_registration}
    username: ${DB_USERNAME:registration_app}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8081}}

security:
  jwt:
    issuer: ${JWT_ISSUER:user-registration}
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWxvY2FsLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtbWU=}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  calls:
    pubsub:
      project-id: ${GCP_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:${GOOGLE_CLOUD_PROJECT_ID:}}}
      topic-id: ${CALL_EVENTS_TOPIC:}
