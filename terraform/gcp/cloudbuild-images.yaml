steps:
  - id: backend-quality-gates
    name: eclipse-temurin:25-jdk-noble
    entrypoint: bash
    args:
      - -ceu
      - |
        chmod +x ./gradlew
        ./gradlew --no-daemon check
    timeout: 1800s

  - id: frontend-quality-gates
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends chromium
        cd angular-ui
        npm ci
        CHROME_BIN=/usr/bin/chromium npm test -- --browsers=ChromeHeadlessNoSandbox --no-progress
    timeout: 1800s

  - id: call-processor-tests
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        cd functions/call-processor
        pip install --no-cache-dir -r requirements.txt
        python -m unittest -v
    timeout: 1800s

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/user-registration-api:${_TAG}
      - .
    waitFor:
      - backend-quality-gates
      - frontend-quality-gates
      - call-processor-tests

  - id: build-ui
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - angular-ui/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/user-registration-ui:${_TAG}
      - angular-ui
    waitFor:
      - backend-quality-gates
      - frontend-quality-gates
      - call-processor-tests

  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - gateway/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/user-registration-gateway:${_TAG}
      - .
    waitFor:
      - backend-quality-gates

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/user-registration-api:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/user-registration-ui:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/user-registration-gateway:${_TAG}

timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
