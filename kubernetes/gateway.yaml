apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-registration-gateway
  namespace: user-registration
  labels:
    app.kubernetes.io/name: user-registration-gateway
    app.kubernetes.io/part-of: user-registration
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: user-registration-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-registration-gateway
        app.kubernetes.io/part-of: user-registration
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: user-registration-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://api:8081
            - name: UI_UPSTREAM
              value: http://ui:80
          startupProbe:
            httpGet:
              path: /gateway-health
              port: http
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /gateway-health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /gateway-health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: user-registration
  labels:
    app.kubernetes.io/name: user-registration-gateway
    app.kubernetes.io/part-of: user-registration
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-registration-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
