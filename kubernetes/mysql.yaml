apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: user-registration
data:
  init-user-database.sh: |
    #!/bin/bash
    set -eu
    mysql --protocol=socket --user=root --password="$MYSQL_ROOT_PASSWORD" <<-EOSQL
    CREATE DATABASE IF NOT EXISTS user_registration_users;
    GRANT ALL PRIVILEGES ON user_registration_users.* TO '${MYSQL_USER}'@'%';
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: user-registration
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: user-registration
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: user-registration
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: user-registration
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: user-registration
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:9
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: user-registration-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: user-registration-secrets
                  key: db-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-registration-secrets
                  key: db-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-registration-secrets
                  key: mysql-root-password
          startupProbe:
            exec:
              command: ["sh", "-ec", 'mysqladmin ping --host=127.0.0.1 --user="$MYSQL_USER" --password="$MYSQL_PASSWORD" --silent']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-ec", 'mysqladmin ping --host=127.0.0.1 --user="$MYSQL_USER" --password="$MYSQL_PASSWORD" --silent']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-ec", 'mysqladmin ping --host=127.0.0.1 --user="$MYSQL_USER" --password="$MYSQL_PASSWORD" --silent']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d/init-user-database.sh
              subPath: init-user-database.sh
              readOnly: true
      volumes:
        - name: mysql-init
          configMap:
            name: mysql-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
