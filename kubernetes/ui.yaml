apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-registration-ui
  namespace: user-registration
  labels:
    app.kubernetes.io/name: user-registration-ui
    app.kubernetes.io/part-of: user-registration
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: user-registration-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-registration-ui
        app.kubernetes.io/part-of: user-registration
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: user-registration-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: user-registration
  labels:
    app.kubernetes.io/name: user-registration-ui
    app.kubernetes.io/part-of: user-registration
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-registration-ui
  ports:
    - name: http
      port: 80
      targetPort: http
