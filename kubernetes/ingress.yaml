apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-registration
  namespace: user-registration
spec:
  ingressClassName: nginx
  rules:
    - host: user-registration.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
