spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_registration_auth}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    issuer: ${JWT_ISSUER:user-registration}
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWxvY2FsLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtbWU=}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8082}
  api-key: ${INTERNAL_API_KEY:local-internal-api-key-change-me}
